<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body>
    <h1>Cadastro do Cliente</h1>
    <form action="">
        <label for="nome">
            Nome:
        </label>
        <br>
        <input type="text"
        id="nome"
        mame="name"
        required
        placeholder="Digite o Nome completo">
        <br><br>
        <label for="email">
            E-mail:
        </label>
        <br><br>
        <input type="email"
        required
        placeholder="Digite seu email"
        id="email"
        name="email">
        <br><br>

        <label for="Idade">
            Idade:
        </label>
        <br><br>
        <input type="number"
        min="18"
        max="90"
        id="idade"
        name="idade">
        <br><br>
        <label for="telefone">
            telefone:
        </label>
        <br>
        <input type="tel"
        id="telefone"
        pattern="[0-9]{11}"
        placeholder="(00)00000.0000">
        <br><br>


        <button type="submit">
            Cadastrar
        </button>












    </form>
</body>
</html>
