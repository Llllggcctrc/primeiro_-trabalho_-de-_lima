<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Geek Code - Pesquisa de Satisfação</title>
</head>

<body>

    <h1>Geek Code</h1>

    <h2>Pesquisa de Satisfação</h2>

    <p>
        Geek-code:
        nos avalie aqui, sua resposta é muito importante.
    </p>

    <form>

        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" name="nome" required>
        <br><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="telefone">Telefone:</label><br>
        <input type="tel" id="telefone" name="telefone" required>
        <br><br>


        <h3>Avaliação Geral</h3>

        <p>Como você avalia sua experiência com a Geek Code?</p>

        <input type="radio" id="otimo" name="avaliacao" value="otimo" required>
        <label for="otimo">Ótimo</label><br>

        <input type="radio" id="bom" name="avaliacao" value="bom">
        <label for="bom">Bom</label><br>

        <input type="radio" id="regular" name="avaliacao" value="regular">
        <label for="regular">Regular</label><br>

        <input type="radio" id="ruim" name="avaliacao" value="ruim">
        <label for="ruim">Ruim</label>


        <h3>Serviços Utilizados</h3>

        <p>Quais serviços você utilizou?</p>

        <input type="checkbox" id="atendimento" name="servicos" value="atendimento">
        <label for="atendimento">Atendimento</label><br>

        <input type="checkbox" id="suporte" name="servicos" value="suporte">
        <label for="suporte">Suporte</label><br>

        <input type="checkbox" id="treinamento" name="servicos" value="treinamento">
        <label for="treinamento">Treinamento</label><br>

        <input type="checkbox" id="consultoria" name="servicos" value="consultoria">
        <label for="consultoria">Consultoria</label>


        <h3>Unidade Atendida</h3>

        <label for="unidade">Selecione a unidade:</label><br>

        <select id="unidade" name="unidade" required>
            <option value="">Selecione</option>
            <option value="sao-paulo">São Paulo</option>
            <option value="rio-de-janeiro">Rio de Janeiro</option>
            <option value="curitiba">Curitiba</option>
        </select>


        <h3>Comentários</h3>

        <label for="comentario">Conte um pouco sobre sua experiência:</label><br>

        <textarea id="comentario" name="comentario" rows="5" cols="40"></textarea>

        <br><br>

        <button type="submit">Enviar Avaliação</button>

    </form>

</body>
</html>
